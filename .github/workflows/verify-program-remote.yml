name: Verify Program (Remote)

# Asks OtterSec to rebuild the e-token program from its otter-verify PDA, so
# explorers show it as verified. Run it after each mainnet upgrade executes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: magicblock-labs/.github/actions/verify-program-remote@405ea5309c82dfe13fe2241713b883a34f609a02
        with:
          program-id: SPLxh1LVZzEkX99H6rqYizhytLWPZVV296zyYDPagv2
