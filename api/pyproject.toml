[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ephemeral-spl-token-api"
version = "0.1.0"
description = "FastAPI service for Ephemeral SPL Token transaction building"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "uvicorn[standard]>=0.27.0",
    "pytest>=7.0.0",
    "httpx>=0.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
