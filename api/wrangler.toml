# Cloudflare Workers configuration for Python Workers
name = "ephemeral-spl-token-api"
main = "src/main.py"
compatibility_date = "2024-01-01"
compatibility_flags = ["python_workers"]

[vars]
EPHEMERAL_CLUSTER_URL = "https://rpc.magicblock.app/mainnet"

[[routes]]
pattern = "privacy.magicblock.app"
custom_domain = true
